{% extends "base.html" %}

{% block title %}Order Placed Successfully{% endblock %}

{% block head %}
    <link rel="stylesheet" href="{{ url_for('static', filename='order_successful.css') }}">
    
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
{% endblock %}


{% block content %}
    <div class="success-page-content">
        <div class="success-container">
            <div class="success-icon">&#10004;</div>
            <h1>Order Placed!</h1>
            <p>Your room service order has been received and is being prepared.</p>
            
            <a href="{{ url_for('services') }}" class="button">Order More</a>
            <a href="{{ url_for('home') }}" class="button">Back to Home</a>
        </div>
    </div>
{% endblock %}
